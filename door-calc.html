<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Չափսերի հաշվիչ</title>
    <meta name="theme-color" content="#185FA5">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-center align-items-center mb-3">
            <div>
                <a href="index.html" class="btn btn-primary">Հետ</a>
            </div>
        </div>
        <h1>Դռան Չափսերի հաշվիչ</h1>
        
        <div class="input-group">
            <label for="width">Լայնություն</label>
            <input type="number" id="width" placeholder="Մուտքագրեք լայնությունը" step="0.1" inputmode="decimal">
            <span class="error" id="widthError">Խնդրում ենք մուտքագրել ճիշտ արժեք</span>
        </div>

        <div class="input-group">
            <label for="height">Բարձրություն</label>
            <input type="number" id="height" placeholder="Մուտքագրեք բարձրությունը" step="0.1" inputmode="decimal">
            <span class="error" id="heightError">Խնդրում ենք մուտքագրել ճիշտ արժեք</span>
        </div>

        <button onclick="calculate()">Հաշվել</button>

        <div class="results" id="results">
            <!-- Վիզուալ ներկայացում -->
            <div class="visual-container">
                <div class="outer-box" id="outerBox">
                    <div class="outer-label" id="outerLabel"></div>
                    <div class="inner-box1">
                            <div class="inner-label-width1" id="innerLabelWidth1"></div>
                            <div class="inner-label-height1" id="innerLabelHeight1"></div>
                            <div class="inner-box" id="innerBox">
                                <div class="inner-label-width" id="innerLabelWidth"></div>
                                <div class="inner-label-height" id="innerLabelHeight"></div>
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker-ը գրանցվեց:'))
        .catch((err) => console.log('Սխալ:', err));
    }
</script>
</body>
</html>
