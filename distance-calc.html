<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ավտոմատ Հաշվիչ</title>
    <meta name="theme-color" content="#185FA5">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body>

    <div class="container">
        <div class="d-flex justify-content-center align-items-center mb-3">
            <div>
                <a href="index.html" class="btn btn-primary">Հետ</a>
            </div>
        </div>
        <h1>Հեռավորության հաշվիչ</h1>
        <div class="input-group">
            <label for="x">Տարածքի երկարություն (x մետր)</label>
            <input type="number" id="x" placeholder="Մուտքագրեք Տարածքի երկարությունը">
        </div>
        
        <div class="input-group">
            <label for="w">Դետալի հաստություն (w)</label>
            <input type="number" id="w" placeholder="Մուտքագրեք Դետալի հաստությունը" step="0.1" inputmode="decimal">
        </div>
        
        <div class="input-group">
            <label for="n">Դետալների քանակ (n)</label>
            <input type="number" id="n" placeholder="Դետալների քանակը">
        </div>
        <button onclick="calculate()">Հաշվել</button>
        <h2 class="text-center mt-3" id="result" style="margin-top: 25px;"></h2>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        function calculate() {
            let x = parseFloat($("#x").val()) || 0;
            let w = parseFloat($("#w").val()) || 0;
            let n = parseFloat($("#n").val()) || 0;

            let a = (x * 100) - (n * w);
            let b = 0;

            if (n + 1 !== 0) {
                b = a / (n + 1);
            }

            $("#result").text(b.toFixed(2));
        }
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('Service Worker-ը գրանցվեց:'))
        .catch((err) => console.log('Սխալ:', err));
    }
    </script>
</body>
</html>
